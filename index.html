<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;background:#f5f5f5;color:#1a1a1a}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:640px;padding:8px;display:flex;flex-direction:column;align-items:center}
.header{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:8px;padding:0 2px}
.title{font-size:min(5vw,22px);font-weight:800;color:#1a1a1a}
.status{display:flex;gap:8px;align-items:center;font-size:min(3.2vw,14px)}
.dot{width:min(4vw,18px);height:min(4vw,18px);border-radius:50%;border:2px solid #888}
.board-wrap{width:100%;aspect-ratio:1;position:relative}
.board{width:100%;height:100%;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:5px;overflow:hidden;border:3px solid #8b6914;box-shadow:0 4px 16px rgba(0,0,0,.2);touch-action:manipulation}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.sq:active{filter:brightness(1.1)}
.sq.light{background:#f0d9b5}.sq.dark{background:#b58863}
.sq.hl-last.light{background:#e8d47a}.sq.hl-last.dark{background:#a89340}
.sq.selected{box-shadow:inset 0 0 0 3px #d00}
.sq .piece{width:82%;height:82%;pointer-events:none}
.sq .legal-dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.2);pointer-events:none}
.sq .legal-capture{position:absolute;width:90%;height:90%;border-radius:50%;border:4px solid rgba(0,0,0,.2);pointer-events:none;box-sizing:border-box}
.coord{position:absolute;font-size:min(2.2vw,10px);font-weight:700;opacity:.5;pointer-events:none;line-height:1}
.captured{height:24px;display:flex;align-items:center;gap:2px;width:100%;padding-left:4px}
.captured svg{width:20px;height:20px}
.cap-diff{font-size:12px;font-weight:700;margin-left:4px}
.controls{display:flex;gap:min(2vw,8px);margin-top:8px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{padding:min(2.5vw,10px) min(4vw,16px);border:2px solid #bbb;border-radius:min(2.5vw,10px);background:#fff;color:#1a1a1a;cursor:pointer;font-size:min(3.5vw,14px);font-family:inherit;white-space:nowrap;font-weight:700}
.btn:active{transform:scale(.95);background:#e8e8e8}.btn.on{border-color:#2563eb;background:#e0ecff;color:#1a4ec5}.btn:disabled{opacity:.3}
.panel{width:100%;margin-top:12px;background:#fff;border-radius:14px;border:2px solid #ddd;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tabs{display:flex;border-bottom:2px solid #e5e5e5;background:#fafafa}
.tab{flex:1;padding:min(3vw,12px) 4px;border:none;background:none;color:#666;font-family:inherit;font-size:min(3vw,13px);font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#c00;border-bottom-color:#c00;background:#fff}
.panel-body{padding:min(4vw,16px);max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.piece-row{display:flex;gap:min(1.5vw,6px)}

.pbtn svg{width:70%;height:70%}

.move-row{display:flex;gap:2px;font-size:min(4vw,16px);line-height:min(9vw,36px);font-family:'SF Mono','Menlo',monospace}
.move-num{color:#888;min-width:min(8vw,34px);text-align:right}
.move-item{min-width:min(18vw,76px);padding:0 min(2vw,8px);border-radius:6px;cursor:pointer;color:#1a1a1a;font-weight:600}
.move-item:active{background:#ddd}.move-item.current{background:#ffd4d4}

.abtn:active{transform:scale(.97)}

.abtn-blue{background:#e0ecff;color:#1a4ec5;border:2px solid #a0bfff}
.lbl{font-size:min(2.8vw,11px);color:#666;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px}
textarea,input[type="text"]{font-family:'SF Mono','Menlo',monospace;font-size:min(3.2vw,13px);background:#fff;border:2px solid #ccc;border-radius:10px;color:#1a1a1a;padding:min(3vw,12px);width:100%;outline:none;resize:vertical;user-select:text;-webkit-user-select:text}
textarea:focus,input:focus{border-color:#2563eb}
.preset-row{display:flex;gap:min(1.5vw,6px);flex-wrap:wrap}
.preset{padding:min(2vw,8px) min(3.5vw,14px);border:2px solid #bbb;border-radius:8px;background:#fff;color:#1a1a1a;cursor:pointer;font-family:inherit;font-size:min(3.5vw,14px);font-weight:600}
.preset:active{background:#e8e8e8}

.eval-bar-fill{height:100%;background:#fff;transition:width .5s ease;position:absolute;left:0;top:0}

.toggle-track{width:48px;height:28px;border-radius:14px;cursor:pointer;position:relative;transition:background .2s;border:2px solid #bbb}
.toggle-track.on{background:#16a34a;border-color:#16a34a}

.toggle-track.off .toggle-knob{left:1px}
.toggle-track.on .toggle-knob{left:23px}

const IFEN="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
let board,selPiece=null,mode="move",flipped=false,highlights={},moveFrom=null;
let sideToMove="w",annotations="",lastMove=null,moveHistory=[],moveNumber=1;
let activeTab="moves",showPanel=true;
// Castling rights: track if K/R have moved
let castleRights={K:true,Q:true,k:true,q:true}; // true = still available

// ===== ANALYSE ENGINE (Lichess Cloud + Lokale Stockfish) =====
let engineOn=false;
let engineLoading=false;
let evalScore=0;
let evalMate=null;
let bestMoveUCI="";
let bestMoveSAN="";
let engineDepth=0;
let evalLine="";
let lastAnalyzedFen="";
let engineSource=""; // "cloud","local",""
let sfWorker=null; // local stockfish worker
let sfReady=false;
let sfLoading=false;

// --- Local Stockfish via Blob Worker ---
function initLocalSF(){
  if(sfWorker||sfLoading)return;
  sfLoading=true;
  // Fetch the stockfish.js source, create blob worker (cross-origin safe)
  fetch('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js')
  .then(function(r){if(!r.ok)throw 'err';return r.text();})
  .then(function(src){
    var blob=new Blob([src],{type:'application/javascript'});
    var url=URL.createObjectURL(blob);
    sfWorker=new Worker(url);
    sfWorker.onmessage=function(e){
      var line=typeof e.data==='string'?e.data:'';
      if(line==='uciok'){sfReady=true;sfLoading=false;sfWorker.postMessage('isready');}
      if(line==='readyok'){
        // If there's a pending analysis, run it
        if(engineOn&&engineSource==="pending-local"){
          runLocalAnalysis();
        }
      }
      if(line.indexOf('info depth')===0){
        var dm=line.match(/depth (\d+)/);
        var sm=line.match(/score cp (-?\d+)/);
        var mm=line.match(/score mate (-?\d+)/);
        var pm=line.match(/ pv (.+)/);
        if(dm)engineDepth=parseInt(dm[1]);
        if(sm){evalScore=parseInt(sm[1]);evalMate=null;}
        if(mm){evalMate=parseInt(mm[1]);evalScore=mm[1]>0?30000:-30000;}
        if(pm){evalLine=pm[1];bestMoveUCI=pm[1].split(' ')[0]||"";bestMoveSAN=uciToSAN(bestMoveUCI);}
        engineSource="local";
        if(engineDepth>=6){engineLoading=false;render();}
      }
      if(line.indexOf('bestmove')===0){
        bestMoveUCI=(line.split(' ')[1])||"";
        bestMoveSAN=uciToSAN(bestMoveUCI);
        engineLoading=false;engineSource="local";render();
      }
    };
    sfWorker.onerror=function(){sfLoading=false;sfReady=false;sfWorker=null;};
    sfWorker.postMessage('uci');
  })
  .catch(function(){sfLoading=false;});
}

function runLocalAnalysis(){
  if(!sfWorker||!sfReady)return;
  sfWorker.postMessage('stop');
  sfWorker.postMessage('position fen '+curFen());
  sfWorker.postMessage('go depth 18');
  engineSource="local";
}

function stopLocalSF(){
  if(sfWorker){
    try{sfWorker.postMessage('stop');sfWorker.postMessage('quit');sfWorker.terminate();}catch(e){}
    sfWorker=null;
  }
  sfReady=false;sfLoading=false;
}

// --- Main analysis: try cloud first, fallback to local ---
function analyzePosition(){
  if(!engineOn)return;
  var fen=curFen();
  if(fen===lastAnalyzedFen)return;
  lastAnalyzedFen=fen;
  engineLoading=true;engineSource="";render();

  // Start loading local SF in background (so it's ready as fallback)
  if(!sfWorker&&!sfLoading)initLocalSF();

  // Try Lichess cloud eval first
  fetch('https://lichess.org/api/cloud-eval?fen='+encodeURIComponent(fen)+'&multiPv=1')
  .then(function(r){
    if(!r.ok)throw 'no cloud';
    return r.json();
  }).then(function(data){
    // Check if position hasn't changed while waiting
    if(curFen()!==fen){return;}
    if(data.pvs&&data.pvs.length>0){
      var pv=data.pvs[0];
      if(pv.cp!==undefined){evalScore=pv.cp;evalMate=null;}
      if(pv.mate!==undefined){evalMate=pv.mate;evalScore=pv.mate>0?30000:-30000;}
      if(pv.moves){evalLine=pv.moves;bestMoveUCI=pv.moves.split(' ')[0]||"";bestMoveSAN=uciToSAN(bestMoveUCI);}
      else{bestMoveUCI="";bestMoveSAN="";}
      engineDepth=data.depth||0;
      engineSource="cloud";
      engineLoading=false;
      render();
    }else{throw 'empty';}
  }).catch(function(){
    // Cloud eval failed or empty — use local Stockfish
    if(curFen()!==fen)return;
    if(sfReady){
      runLocalAnalysis();
    }else{
      // SF still loading, mark as pending
      engineSource="pending-local";
    }
  });
}

function toggleEngine(){
  engineOn=!engineOn;
  if(engineOn){
    lastAnalyzedFen="";
    analyzePosition();
  }else{
    engineLoading=false;evalScore=0;evalMate=null;
    bestMoveUCI="";bestMoveSAN="";engineDepth=0;evalLine="";
    lastAnalyzedFen="";engineSource="";
    if(sfWorker){try{sfWorker.postMessage('stop');}catch(e){}}
  }
  saveState();render();
}

// Convert UCI move (e.g. e2e4) to readable notation
function uciToSAN(uci){
  if(!uci||uci.length<4)return uci;
  var from=uci.substring(0,2),to=uci.substring(2,4),promo=uci[4]||"";
  var fC=from.charCodeAt(0)-97,fR=8-parseInt(from[1]);
  var tC=to.charCodeAt(0)-97,tR=8-parseInt(to[1]);
  var pc=board[fR]&&board[fR][fC];
  if(!pc)return from+"→"+to;
  if(pc.toUpperCase()==="K"&&Math.abs(fC-tC)===2){return tC>fC?"O-O":"O-O-O";}
  var sym=pSym(pc);
  var cap=board[tR]&&board[tR][tC];
  var san;
  if(pc==="P"||pc==="p"){san=cap?from[0]+"x"+to:to;}
  else{san=sym+(cap?"x":"")+to;}
  if(promo)san+="="+(({q:"D",r:"T",b:"L",n:"P"})[promo]||promo.toUpperCase());
  return san;
}

function getEvalDisplay(){
  if(evalMate!==null){
    if(evalMate>0)return{text:"M"+evalMate,color:"#16a34a",pct:95};
    return{text:"M"+evalMate,color:"#dc2626",pct:5};
  }
  var capped=Math.max(-1000,Math.min(1000,evalScore));
  var pct=Math.round(50+capped/20);
  var clampPct=Math.max(3,Math.min(97,pct));
  var sc=evalScore/100;
  var sign=sc>=0?"+":"";
  return{text:sign+sc.toFixed(1),color:sc>=0.3?"#16a34a":sc<=-0.3?"#dc2626":"#666",pct:clampPct};
}

const PRESETS=[["Start",IFEN],["Leeg","8/8/8/8/8/8/8/8 w - - 0 1"],["K+P","8/8/8/4k3/8/8/4P3/4K3 w - - 0 1"],["D vs T","8/8/8/4k3/8/2r5/8/3QK3 w - - 0 1"],["Lucena","1K1k4/1P6/8/8/8/8/r7/2R5 w - - 0 1"],["Philidor","5k2/8/5K2/5P2/8/8/8/r4R2 w - - 0 1"]];

function fenToBoard(fen){const b=Array.from({length:8},()=>Array(8).fill(null));const rows=fen.split(" ")[0].split("/");for(let r=0;r<8;r++){let c=0;for(const ch of rows[r]){if(ch>="1"&&ch<="8")c+=parseInt(ch);else{b[r][c]=ch;c++;}}}return b;}
function boardToFen(b,x){let f="";for(let r=0;r<8;r++){let e=0;for(let c=0;c<8;c++){if(b[r][c]){if(e>0){f+=e;e=0;}f+=b[r][c];}else e++;}if(e>0)f+=e;if(r<7)f+="/";}return f+" "+x;}
function cloneBoard(b){return b.map(r=>[...r]);}
function sqName(r,c){return FL[c]+RK[r];}
function pSym(p){return{K:"K",Q:"D",R:"T",B:"L",N:"P",P:"",k:"K",q:"D",r:"T",b:"L",n:"P",p:""}[p]||"";}
function isWhite(p){return p&&p===p.toUpperCase();}
function isBlack(p){return p&&p===p.toLowerCase();}
function inBounds(r,c){return r>=0&&r<8&&c>=0&&c<8;}

board=fenToBoard(IFEN);

// ===== CHESS RULES ENGINE =====

function findKing(b,white){
  const k=white?"K":"k";
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]===k)return{r,c};
  return null;
}

// Is square (r,c) attacked by side 'byWhite'?
function isAttacked(b,r,c,byWhite){
  // Pawn attacks
  if(byWhite){
    if(inBounds(r+1,c-1)&&b[r+1][c-1]==="P")return true;
    if(inBounds(r+1,c+1)&&b[r+1][c+1]==="P")return true;
  }else{
    if(inBounds(r-1,c-1)&&b[r-1][c-1]==="p")return true;
    if(inBounds(r-1,c+1)&&b[r-1][c+1]==="p")return true;
  }
  // Knight attacks
  const kn=byWhite?"N":"n";
  for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
    const nr=r+dr,nc=c+dc;
    if(inBounds(nr,nc)&&b[nr][nc]===kn)return true;
  }
  // King attacks
  const kg=byWhite?"K":"k";
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    const nr=r+dr,nc=c+dc;
    if(inBounds(nr,nc)&&b[nr][nc]===kg)return true;
  }
  // Rook/Queen (straight lines)
  const rq=byWhite?["R","Q"]:["r","q"];
  for(const[dr,dc]of[[0,1],[0,-1],[1,0],[-1,0]]){
    let nr=r+dr,nc=c+dc;
    while(inBounds(nr,nc)){
      if(b[nr][nc]){if(rq.includes(b[nr][nc]))return true;break;}
      nr+=dr;nc+=dc;
    }
  }
  // Bishop/Queen (diagonals)
  const bq=byWhite?["B","Q"]:["b","q"];
  for(const[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){
    let nr=r+dr,nc=c+dc;
    while(inBounds(nr,nc)){
      if(b[nr][nc]){if(bq.includes(b[nr][nc]))return true;break;}
      nr+=dr;nc+=dc;
    }
  }
  return false;
}

function isInCheck(b,white){
  const kg=findKing(b,white);
  if(!kg)return false;
  return isAttacked(b,kg.r,kg.c,!white);
}

// Try a move on a cloned board, return true if own king is NOT in check after
function tryMove(b,fR,fC,tR,tC,epTarget){
  const nb=cloneBoard(b);
  const pc=nb[fR][fC];
  const white=isWhite(pc);
  nb[tR][tC]=pc;nb[fR][fC]=null;
  // En passant capture
  if((pc==="P"||pc==="p")&&epTarget&&tR===epTarget.r&&tC===epTarget.c){
    nb[fR][tC]=null; // remove captured pawn
  }
  // Castling: move rook too
  if(pc==="K"&&fC===4){
    if(tC===6){nb[7][5]=nb[7][7];nb[7][7]=null;} // K-side
    if(tC===2){nb[7][3]=nb[7][0];nb[7][0]=null;} // Q-side
  }
  if(pc==="k"&&fC===4){
    if(tC===6){nb[0][5]=nb[0][7];nb[0][7]=null;}
    if(tC===2){nb[0][3]=nb[0][0];nb[0][0]=null;}
  }
  return !isInCheck(nb,white);
}

// Generate all legal moves for piece at (fR,fC)
function getLegalMoves(fR,fC){
  const pc=board[fR][fC];
  if(!pc)return[];
  const white=isWhite(pc);
  const moves=[];// [{r,c,special}]
  const type=pc.toUpperCase();
  const enemy=white?isBlack:isWhite;
  const friendly=white?isWhite:isBlack;

  function addIf(r,c,special){
    if(!inBounds(r,c))return;
    if(friendly(board[r][c]))return;
    if(tryMove(board,fR,fC,r,c,enPassantTarget))moves.push({r,c,special:special||null});
  }

  if(type==="P"){
    const dir=white?-1:1;
    const startRow=white?6:1;
    const promoRow=white?0:7;
    // Forward 1
    if(inBounds(fR+dir,fC)&&!board[fR+dir][fC]){
      addIf(fR+dir,fC,fR+dir===promoRow?"promo":null);
      // Forward 2 from start
      if(fR===startRow&&!board[fR+2*dir][fC])addIf(fR+2*dir,fC,"double");
    }
    // Captures
    for(const dc of[-1,1]){
      const nr=fR+dir,nc=fC+dc;
      if(!inBounds(nr,nc))continue;
      if(enemy(board[nr][nc]))addIf(nr,nc,nr===promoRow?"promo":null);
      // En passant
      if(enPassantTarget&&nr===enPassantTarget.r&&nc===enPassantTarget.c)addIf(nr,nc,"ep");
    }
  }
  else if(type==="N"){
    for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])addIf(fR+dr,fC+dc);
  }
  else if(type==="K"){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr||dc)addIf(fR+dr,fC+dc);}
    // Castling
    const row=white?7:0;
    const ks=white?"K":"k",qs=white?"Q":"q";
    if(fR===row&&fC===4&&!isInCheck(board,white)){
      // King-side
      if(castleRights[ks]&&!board[row][5]&&!board[row][6]&&board[row][7]===(white?"R":"r")){
        if(!isAttacked(board,row,5,!white)&&!isAttacked(board,row,6,!white))
          addIf(row,6,"castle-k");
      }
      // Queen-side
      if(castleRights[qs]&&!board[row][3]&&!board[row][2]&&!board[row][1]&&board[row][0]===(white?"R":"r")){
        if(!isAttacked(board,row,3,!white)&&!isAttacked(board,row,2,!white))
          addIf(row,2,"castle-q");
      }
    }
  }
  else{
    // Sliding pieces
    const dirs=[];
    if(type==="R"||type==="Q")dirs.push([0,1],[0,-1],[1,0],[-1,0]);
    if(type==="B"||type==="Q")dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
    for(const[dr,dc]of dirs){
      let nr=fR+dr,nc=fC+dc;
      while(inBounds(nr,nc)){
        if(friendly(board[nr][nc]))break;
        addIf(nr,nc);
        if(board[nr][nc])break; // hit enemy piece, stop after
        nr+=dr;nc+=dc;
      }
    }
  }
  return moves;
}

// Check if current side has any legal moves
function hasLegalMoves(white){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const pc=board[r][c];
    if(!pc)continue;
    if(white&&!isWhite(pc))continue;
    if(!white&&!isBlack(pc))continue;
    if(getLegalMoves(r,c).length>0)return true;
  }
  return false;
}

function updateGameStatus(){
  const white=sideToMove==="w";
  const inCheck=isInCheck(board,white);
  const hasMoves=hasLegalMoves(white);
  if(inCheck&&!hasMoves)gameStatus="checkmate";
  else if(!inCheck&&!hasMoves)gameStatus="stalemate";
  else if(inCheck)gameStatus="check";
  else gameStatus="";
}

function genNotation(pc,fR,fC,tR,tC,cap,special){
  const sym=pSym(pc),to=sqName(tR,tC);
  if(special==="castle-k")return "O-O";
  if(special==="castle-q")return "O-O-O";
  let not;
  if(pc==="P"||pc==="p")not=cap?FL[fC]+"x"+to:to;
  else not=sym+sqName(fR,fC)+(cap?"x":"")+to;
  if(special==="promo")not+="D"; // Dutch: dame
  // Check/mate suffix added after
  return not;
}

// ===== SAVE / LOAD =====
function saveState(){
  try{localStorage.setItem('schaakstelling2',JSON.stringify({
    fen:boardToFen(board,sideToMove+" KQkq - 0 1"),
    moveHistory,moveNumber,sideToMove,annotations,flipped,lastMove,mode,activeTab,showPanel,highlights,
    castleRights,enPassantTarget,gameStatus,engineOn
  }));}catch(e){}
}
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem('schaakstelling2'));
    if(!s||!s.fen)return false;
    board=fenToBoard(s.fen);sideToMove=s.sideToMove||"w";
    moveHistory=s.moveHistory||[];moveNumber=s.moveNumber||1;
    annotations=s.annotations||"";flipped=!!s.flipped;lastMove=s.lastMove||null;
    mode=s.mode||"move";activeTab=s.activeTab||"moves";showPanel=s.showPanel!==false;
    highlights=s.highlights||{};castleRights=s.castleRights||{K:true,Q:true,k:true,q:true};
    enPassantTarget=s.enPassantTarget||null;gameStatus=s.gameStatus||"";
    if(s.engineOn){engineOn=true;}
    return true;
  }catch(e){return false;}
}
loadState();
updateGameStatus();

let legalTargets={}; // key "r-c" for current selection

function handleSq(r,c){
  if(mode==="place"&&selPiece){board[r][c]=selPiece;updateGameStatus();if(engineOn){lastAnalyzedFen="";analyzePosition();};saveState();render();return;}
  if(mode==="delete"){board[r][c]=null;updateGameStatus();if(engineOn){lastAnalyzedFen="";analyzePosition();};saveState();render();return;}
  // Move mode
  if(gameStatus==="checkmate"||gameStatus==="stalemate"){moveFrom=null;render();return;}
  if(moveFrom){
    const key=r+"-"+c;
    if(legalTargets[key]){
      // Execute legal move
      const pc=board[moveFrom.r][moveFrom.c],white=isWhite(pc);
      const move=legalTargets[key];
      const cap=board[r][c];
      const bB=cloneBoard(board);
      const oldCR={...castleRights},oldEP=enPassantTarget;

      board[r][c]=board[moveFrom.r][moveFrom.c];board[moveFrom.r][moveFrom.c]=null;

      // En passant capture
      if(move.special==="ep"){board[moveFrom.r][c]=null;}
      // Castling
      if(move.special==="castle-k"){const row=white?7:0;board[row][5]=board[row][7];board[row][7]=null;}
      if(move.special==="castle-q"){const row=white?7:0;board[row][3]=board[row][0];board[row][0]=null;}
      // Promotion
      if(move.special==="promo"){board[r][c]=white?"Q":"q";}
      // Update en passant target
      enPassantTarget=null;
      if(move.special==="double"){
        enPassantTarget={r:white?moveFrom.r-1:moveFrom.r+1,c:moveFrom.c};
      }
      // Update castling rights
      const p=pc.toUpperCase();
      if(p==="K"){if(white){castleRights.K=false;castleRights.Q=false;}else{castleRights.k=false;castleRights.q=false;}}
      if(p==="R"){
        if(white){if(moveFrom.r===7&&moveFrom.c===7)castleRights.K=false;if(moveFrom.r===7&&moveFrom.c===0)castleRights.Q=false;}
        else{if(moveFrom.r===0&&moveFrom.c===7)castleRights.k=false;if(moveFrom.r===0&&moveFrom.c===0)castleRights.q=false;}
      }
      // If rook captured, remove that castling right
      if(r===0&&c===7)castleRights.k=false;if(r===0&&c===0)castleRights.q=false;
      if(r===7&&c===7)castleRights.K=false;if(r===7&&c===0)castleRights.Q=false;

      const epCap=move.special==="ep"?true:false;
      const not=genNotation(pc,moveFrom.r,moveFrom.c,r,c,cap||epCap,move.special);

      lastMove={fR:moveFrom.r,fC:moveFrom.c,tR:r,tC:c};
      if(white)sideToMove="b";else{sideToMove="w";moveNumber++;}
      updateGameStatus();
      // Add check/mate notation
      let notFinal=not;
      if(gameStatus==="checkmate")notFinal+="#";
      else if(gameStatus==="check")notFinal+="+";

      moveHistory.push({not:notFinal,bB,bA:cloneBoard(board),side:white?"w":"b",cap:cap||(epCap?true:null),fR:moveFrom.r,fC:moveFrom.c,tR:r,tC:c,mn:moveNumber-(white?0:0),
        oldCR,oldEP,castleRights:{...castleRights},enPassantTarget,special:move.special});

      moveFrom=null;legalTargets={};highlights={};if(engineOn){lastAnalyzedFen="";analyzePosition();}saveState();render();
    }else{
      // Clicking another own piece? Re-select
      const pc=board[r][c];
      const white=sideToMove==="w";
      if(pc&&((white&&isWhite(pc))||(!white&&isBlack(pc)))){
        moveFrom={r,c};
        const moves=getLegalMoves(r,c);
        legalTargets={};moves.forEach(m=>{legalTargets[m.r+"-"+m.c]=m;});
        render();
      }else{moveFrom=null;legalTargets={};render();}
    }
  }else{
    // Select piece
    const pc=board[r][c];
    const white=sideToMove==="w";
    if(pc&&((white&&isWhite(pc))||(!white&&isBlack(pc)))){
      moveFrom={r,c};
      const moves=getLegalMoves(r,c);
      legalTargets={};moves.forEach(m=>{legalTargets[m.r+"-"+m.c]=m;});
      render();
    }
  }
}

function undo(){
  if(!moveHistory.length)return;const last=moveHistory.pop();
  board=last.bB;
  if(last.side==="w"){sideToMove="w";castleRights=last.oldCR;}
  else{sideToMove="b";moveNumber=Math.max(1,moveNumber-1);castleRights=last.oldCR;}
  enPassantTarget=last.oldEP||null;
  if(moveHistory.length){const p=moveHistory[moveHistory.length-1];lastMove={fR:p.fR,fC:p.fC,tR:p.tR,tC:p.tC};enPassantTarget=p.enPassantTarget||null;castleRights={...p.castleRights};}
  else{lastMove=null;enPassantTarget=null;}
  moveFrom=null;legalTargets={};updateGameStatus();if(engineOn){lastAnalyzedFen="";analyzePosition();};saveState();render();
}

function loadFen(f){try{board=fenToBoard(f);const p=f.split(" ");if(p[1])sideToMove=p[1];
  // Parse castling from FEN
  castleRights={K:false,Q:false,k:false,q:false};
  if(p[2]){const c=p[2];if(c.includes("K"))castleRights.K=true;if(c.includes("Q"))castleRights.Q=true;if(c.includes("k"))castleRights.k=true;if(c.includes("q"))castleRights.q=true;}
  enPassantTarget=null;highlights={};moveFrom=null;lastMove=null;moveHistory=[];moveNumber=1;legalTargets={};gameStatus="";updateGameStatus();if(engineOn){lastAnalyzedFen="";analyzePosition();};saveState();render();}catch(e){}}
function clearBoard(){board=Array.from({length:8},()=>Array(8).fill(null));highlights={};annotations="";moveFrom=null;lastMove=null;moveHistory=[];moveNumber=1;castleRights={K:false,Q:false,k:false,q:false};enPassantTarget=null;legalTargets={};gameStatus="";saveState();render();}
function newGame(){loadFen(IFEN);annotations="";castleRights={K:true,Q:true,k:true,q:true};saveState();}
function doCopy(t){
  // iOS Safari fallback for clipboard
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){showCopied();}).catch(function(){fallbackCopy(t);});
    }else{fallbackCopy(t);}
  }catch(e){fallbackCopy(t);}
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');
  ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();ta.select();
  ta.setSelectionRange(0,t.length);
  try{document.execCommand('copy');showCopied();}catch(e){
    // Last resort: prompt user
    prompt('Kopieer handmatig:',t);
  }
  document.body.removeChild(ta);
}
function showCopied(){showMsg("✓ Gekopieerd!");}
function curFen(){
  let cr="";if(castleRights.K)cr+="K";if(castleRights.Q)cr+="Q";if(castleRights.k)cr+="k";if(castleRights.q)cr+="q";if(!cr)cr="-";
  let ep=enPassantTarget?sqName(enPassantTarget.r,enPassantTarget.c):"-";
  return boardToFen(board,sideToMove+" "+cr+" "+ep+" 0 "+moveNumber);
}
function buildPgn(){
  let pgn='[FEN "'+IFEN+'"]\n[SetUp "1"]\n\n',pairs=[],cur=null;
  for(const m of moveHistory){if(m.side==="w"){cur={n:m.mn||moveNumber,w:m.not,b:null};pairs.push(cur);}else{if(cur&&cur.b===null)cur.b=m.not;else pairs.push({n:m.mn||moveNumber,w:"...",b:m.not});}}
  pgn+=pairs.map(p=>p.n+". "+p.w+(p.b?" "+p.b:"")).join(" ");
  if(gameStatus==="checkmate")pgn+=" "+(sideToMove==="w"?"0-1":"1-0");
  else if(gameStatus==="stalemate")pgn+=" 1/2-1/2";
  else pgn+=" *";
  if(annotations)pgn+="\n\n{"+annotations+"}";return pgn;
}
function toggleHL(r,c){const k=r+'-'+c;if(highlights[k])delete highlights[k];else{const cols=['#ef444480','#22c55e80','#eab30880','#8b5cf680'];highlights[k]=cols[Object.keys(highlights).length%cols.length];}saveState();render();}
function goToMove(i){board=cloneBoard(moveHistory[i].bA);lastMove={fR:moveHistory[i].fR,fC:moveHistory[i].fC,tR:moveHistory[i].tR,tC:moveHistory[i].tC};legalTargets={};moveFrom=null;if(engineOn){lastAnalyzedFen="";analyzePosition();};render();}
function addSym(s){annotations+=s;saveState();render();const ta=document.getElementById('annArea');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}}

// ===== EXPORT / IMPORT FULL GAME STATE =====
function exportGame(){
  const data={
    v:2,fen:curFen(),
    moves:moveHistory.map(m=>({not:m.not,side:m.side,fR:m.fR,fC:m.fC,tR:m.tR,tC:m.tC,mn:m.mn,special:m.special||null})),
    ann:annotations,stm:sideToMove,mn:moveNumber,cr:castleRights,ep:enPassantTarget,flip:flipped
  };

function importGame(code){
  try{
    code=code.trim();
    if(code.startsWith("SS2:"))code=code.substring(4);
    const data=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(!data.fen)throw "Geen FEN";
    board=fenToBoard(data.fen);
    sideToMove=data.stm||"w";moveNumber=data.mn||1;
    annotations=data.ann||"";flipped=!!data.flip;
    castleRights=data.cr||{K:true,Q:true,k:true,q:true};
    enPassantTarget=data.ep||null;
    moveHistory=[];
    if(data.moves&&data.moves.length>0){
      let rb=fenToBoard(IFEN),rc={K:true,Q:true,k:true,q:true},re=null;
      for(const mv of data.moves){
        const bB=cloneBoard(rb),pc=rb[mv.fR][mv.fC];
        if(!pc)break;
        const cap=rb[mv.tR][mv.tC],white=pc===pc.toUpperCase();
        rb[mv.tR][mv.tC]=rb[mv.fR][mv.fC];rb[mv.fR][mv.fC]=null;
        if(mv.special==="ep")rb[mv.fR][mv.tC]=null;
        if(mv.special==="castle-k"){const row=white?7:0;rb[row][5]=rb[row][7];rb[row][7]=null;}
        if(mv.special==="castle-q"){const row=white?7:0;rb[row][3]=rb[row][0];rb[row][0]=null;}
        if(mv.special==="promo")rb[mv.tR][mv.tC]=white?"Q":"q";
        const newEP=mv.special==="double"?{r:white?mv.fR-1:mv.fR+1,c:mv.fC}:null;
        const oldCR={...rc};
        const pUp=pc.toUpperCase();
        if(pUp==="K"){if(white){rc.K=false;rc.Q=false;}else{rc.k=false;rc.q=false;}}
        if(pUp==="R"){if(white){if(mv.fR===7&&mv.fC===7)rc.K=false;if(mv.fR===7&&mv.fC===0)rc.Q=false;}else{if(mv.fR===0&&mv.fC===7)rc.k=false;if(mv.fR===0&&mv.fC===0)rc.q=false;}}
        if(mv.tR===0&&mv.tC===7)rc.k=false;if(mv.tR===0&&mv.tC===0)rc.q=false;
        if(mv.tR===7&&mv.tC===7)rc.K=false;if(mv.tR===7&&mv.tC===0)rc.Q=false;
        moveHistory.push({not:mv.not,bB,bA:cloneBoard(rb),side:mv.side,cap:cap||(mv.special==="ep"?true:null),fR:mv.fR,fC:mv.fC,tR:mv.tR,tC:mv.tC,mn:mv.mn,oldCR,oldEP:re,castleRights:{...rc},enPassantTarget:newEP,special:mv.special});
        re=newEP;
      }
      board=rb;castleRights={...rc};enPassantTarget=re;
    }
    if(moveHistory.length){const lm=moveHistory[moveHistory.length-1];lastMove={fR:lm.fR,fC:lm.fC,tR:lm.tR,tC:lm.tC};}
    else lastMove=null;
    highlights={};moveFrom=null;legalTargets={};
    updateGameStatus();if(engineOn){lastAnalyzedFen="";analyzePosition();};saveState();render();
    showMsg("✓ Stand geladen!");return true;
  }catch(e){showMsg("✗ Ongeldige code");return false;}
}

function showMsg(msg){
  let el=document.getElementById('copy-toast');if(el)el.remove();
  el=document.createElement('div');el.id='copy-toast';el.textContent=msg;
  const isErr=msg.indexOf("✗")>=0;
  el.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:'+(isErr?'#dc2626':'#16a34a')+';color:#fff;padding:14px 28px;border-radius:12px;font-size:17px;font-weight:700;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);pointer-events:none;';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),400);},1500);
}

function shareGame(){
  const code=exportGame();
  const text="♛ Schaakstelling partij:\n\n"+code+"\n\nOpen Schaakstelling → Delen → plak de code → Laad partij";
  if(navigator.share){
    navigator.share({title:"Schaakstelling partij",text:text}).catch(()=>{doCopy(code);});
  }else{doCopy(code);}
}

function render(){
  const vals={P:1,N:3,B:3,R:5,Q:9,K:0,p:1,n:3,b:3,r:5,q:9,k:0};
  let wM=0,bM=0;board.flat().forEach(p=>{if(p){if(p===p.toUpperCase())wM+=vals[p]||0;else bM+=vals[p]||0;}});
  const diff=wM-bM;
  const wCap=moveHistory.filter(m=>m.cap&&typeof m.cap==='string'&&m.cap===m.cap.toLowerCase()).map(m=>m.cap);
  const bCap=moveHistory.filter(m=>m.cap&&typeof m.cap==='string'&&m.cap===m.cap.toUpperCase()).map(m=>m.cap);
  const dR=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
  const dC=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];

  let h='<div class="header"><span class="title">♛ Schaakstelling</span><div class="status">';
  h+='<span style="color:'+(diff>0?'#16a34a':diff<0?'#dc2626':'#ca8a04')+';font-weight:800">'+(diff>0?'+'+diff:diff<0?''+diff:'=')+'</span>';
  h+='<div class="dot" style="background:'+(sideToMove==='w'?'#fff':'#222')+'"></div>';
  h+='</div></div>';

  // Game status banner
  if(gameStatus==="checkmate")h+='<div class="game-status" style="background:#fde8e8;color:#b00">Schaakmat! '+(sideToMove==='w'?'Zwart':'Wit')+' wint.</div>';
  else if(gameStatus==="stalemate")h+='<div class="game-status" style="background:#fef9c3;color:#92400e">Pat — remise!</div>';
  else if(gameStatus==="check")h+='<div class="game-status" style="background:#fff3cd;color:#92400e">Schaak!</div>';

  // Engine eval bar
  if(engineOn){
    var ev=getEvalDisplay();
    h+='<div class="eval-bar-wrap">';
    h+='<div class="eval-score" style="color:'+ev.color+'">'+ev.text+'</div>';
    h+='<div class="eval-bar"><div class="eval-bar-fill" style="width:'+ev.pct+'%"></div></div>';
    h+='</div>';
    h+='<div class="engine-info">';
    if(engineLoading){
      h+='<span style="color:#888">⏳ Analyseren...</span>';
      if(sfLoading)h+=' <span class="depth">(Stockfish laden...)</span>';
    }else if(bestMoveSAN){
      h+='Beste zet: <span class="best-move">'+bestMoveSAN+'</span>';
      if(engineSource==="cloud")h+=' <span class="depth">(diepte '+engineDepth+' · ☁ Lichess Cloud)</span>';
      else if(engineSource==="local")h+=' <span class="depth">(diepte '+engineDepth+' · 🔧 Stockfish lokaal)</span>';
    }else{
      h+='<span style="color:#888">Geen analyse beschikbaar</span>';
    }
    h+='</div>';
  }

  h+='<div class="captured">';wCap.forEach(p=>{h+=SVGP[p];});if(wCap.length&&diff<0)h+='<span class="cap-diff" style="color:#dc2626">+'+Math.abs(diff)+'</span>';h+='</div>';

  h+='<div class="board-wrap"><div class="board">';
  for(const r of dR)for(const c of dC){
    const light=(r+c)%2===0,pc=board[r][c];
    const isFrom=moveFrom&&moveFrom.r===r&&moveFrom.c===c;
    const isLast=lastMove&&((lastMove.fR===r&&lastMove.fC===c)||(lastMove.tR===r&&lastMove.tC===c));
    const hlKey=r+'-'+c,hlColor=highlights[hlKey];
    const isLegal=!!legalTargets[hlKey];
    let cls='sq '+(light?'light':'dark');
    if(isLast&&!hlColor)cls+=' hl-last';if(isFrom)cls+=' selected';
    let style=hlColor?'background:'+hlColor:'';
    h+='<div class="'+cls+'" style="'+style+'" onclick="handleSq('+r+','+c+')" oncontextmenu="event.preventDefault();toggleHL('+r+','+c+')">';
    if(c===dC[0])h+='<span class="coord" style="top:2px;left:3px;color:'+(light?'#b58863':'#f0d9b5')+'">'+RK[r]+'</span>';
    if(r===dR[7])h+='<span class="coord" style="bottom:1px;right:3px;color:'+(light?'#b58863':'#f0d9b5')+'">'+FL[c]+'</span>';
    if(pc)h+='<div class="piece">'+SVGP[pc]+'</div>';
    if(isLegal&&mode==="move"){
      if(pc)h+='<div class="legal-capture"></div>';
      else h+='<div class="legal-dot"></div>';
    }
    h+='</div>';
  }
  h+='</div></div>';

  h+='<div class="captured">';bCap.forEach(p=>{h+=SVGP[p];});if(bCap.length&&diff>0)h+='<span class="cap-diff" style="color:#16a34a">+'+diff+'</span>';h+='</div>';

  h+='<div class="controls">';
  h+='<button class="btn" onclick="undo()"'+(moveHistory.length?'':' disabled')+'>↩ Ongedaan</button>';
  h+='<button class="btn" onclick="flipped=!flipped;saveState();render()">⟳ Draai</button>';
  h+='<button class="btn" onclick="sideToMove=sideToMove===\'w\'?\'b\':\'w\';if(engineOn){lastAnalyzedFen=\'\';analyzePosition();}saveState();render()">'+(sideToMove==='w'?'♔ Wit aan zet':'♚ Zwart aan zet')+'</button>';
  h+='<button class="btn" onclick="newGame()">Nieuw</button>';
  h+='<button class="btn'+(engineOn?' on':'')+'" onclick="toggleEngine()" style="'+(engineOn?'border-color:#16a34a;background:#e8f5e9;color:#1b5e20':'')+'">🔬 '+(engineOn?'Engine Aan':'Engine')+'</button>';
  h+='<button class="btn" onclick="showPanel=!showPanel;saveState();render()">'+(showPanel?'▲ Verberg':'▼ Paneel')+'</button>';
  h+='</div>';

  if(showPanel){
    h+='<div class="panel"><div class="tabs">';
    ['moves','setup','pgn','notes','share'].forEach(t=>{
      const labels={moves:'Zetten',setup:'Stukken',pgn:'FEN/PGN',notes:'Notities',share:'Delen'};
      h+='<button class="tab'+(activeTab===t?' on':'')+'" onclick="activeTab=\''+t+'\';if(activeTab!==\'setup\'){mode=\'move\';moveFrom=null;legalTargets={};}saveState();render()">'+labels[t]+'</button>';
    });
    h+='</div><div class="panel-body">';

    if(activeTab==='moves'){
      h+='<div class="moves-box">';
      if(!moveHistory.length){h+='<div style="color:#999;text-align:center;padding:24px;font-size:min(3.8vw,15px)">Nog geen zetten.<br><span style="font-size:min(3.2vw,13px);opacity:.7">Klik een stuk, dan een groen doelveld.</span></div>';}
      else{
        let pairs=[],cur=null;
        for(let i=0;i<moveHistory.length;i++){const m=moveHistory[i];if(m.side==='w'){cur={n:m.mn,w:m.not,wI:i,b:null,bI:null};pairs.push(cur);}else{if(cur&&cur.b===null){cur.b=m.not;cur.bI=i;}else pairs.push({n:m.mn,w:null,wI:null,b:m.not,bI:i});}}
        pairs.forEach(p=>{
          h+='<div class="move-row"><span class="move-num">'+(p.n||'')+'.</span>';
          if(p.w!==null)h+='<span class="move-item'+(p.wI===moveHistory.length-1?' current':'')+'" onclick="goToMove('+p.wI+')">'+p.w+'</span>';
          else h+='<span class="move-empty">…</span>';
          if(p.b!==null)h+='<span class="move-item'+(p.bI===moveHistory.length-1?' current':'')+'" onclick="goToMove('+p.bI+')">'+p.b+'</span>';
          h+='</div>';
        });
      }
      h+='</div>';
      h+='<div class="flex-row mt"><button class="abtn abtn-red flex-1" onclick="undo()"'+(moveHistory.length?'':' disabled')+'>↩ Ongedaan</button>';
      h+='<button class="abtn abtn-blue flex-1" onclick="doCopy(buildPgn())">📋 PGN</button></div>';
      h+='<div class="hint">Klik op een zet om die positie te bekijken</div>';
    }
    if(activeTab==='setup'){
      h+='<div class="flex-row mb">';
      ['place','move','delete'].forEach(m=>{
        const labels={place:'✚ Plaatsen',move:'↔ Verplaats',delete:'✕ Wissen'};
        h+='<button class="btn flex-1'+(mode===m?' on':'')+'" style="text-align:center;font-size:min(3.2vw,13px)" onclick="mode=\''+m+'\';if(mode!==\'move\')moveFrom=null;legalTargets={};saveState();render()">'+labels[m]+'</button>';
      });
      h+='</div>';
      h+='<div class="lbl">Witte stukken</div><div class="piece-row mb">';
      'KQRBNP'.split('').forEach(p=>{h+='<button class="pbtn'+(selPiece===p&&mode==='place'?' on':'')+'" onclick="selPiece=\''+p+'\';mode=\'place\';legalTargets={};render()">'+SVGP[p]+'</button>';});
      h+='</div>';
      h+='<div class="lbl">Zwarte stukken</div><div class="piece-row mb">';
      'kqrbnp'.split('').forEach(p=>{h+='<button class="pbtn'+(selPiece===p&&mode==='place'?' on':'')+'" onclick="selPiece=\''+p+'\';mode=\'place\';legalTargets={};render()">'+SVGP[p]+'</button>';});
      h+='</div>';
      h+='<div class="preset-row mb">';
      PRESETS.forEach(([n,f])=>{h+='<button class="preset" onclick="loadFen(\''+f+'\')">'+n+'</button>';});
      h+='</div>';
      h+='<button class="abtn abtn-red w100" onclick="clearBoard()">Bord leegmaken</button>';
    }
    if(activeTab==='pgn'){
      h+='<div class="lbl">FEN</div><div class="flex-row mb"><input type="text" value="'+curFen().replace(/"/g,'&quot;')+'" readonly style="flex:1"><button class="abtn abtn-blue" onclick="doCopy(curFen())">📋</button></div>';
      h+='<div class="lbl">PGN</div><textarea rows="4" readonly>'+buildPgn().replace(/</g,'&lt;')+'</textarea>';
      h+='<button class="abtn abtn-blue w100 mt" onclick="doCopy(buildPgn())">📋 Kopieer PGN</button>';
      h+='<div class="lbl mt">Importeer FEN</div><div class="flex-row"><input type="text" id="fenIn" placeholder="Plak FEN hier..." style="flex:1"><button class="abtn abtn-blue" onclick="var v=document.getElementById(\'fenIn\').value.trim();if(v){loadFen(v);}">Laden</button></div>';
      h+='<div class="preset-row mt">';
      PRESETS.forEach(([n,f])=>{h+='<button class="preset" onclick="loadFen(\''+f+'\')">'+n+'</button>';});
      h+='</div>';
    }
    if(activeTab==='notes'){
      h+='<div class="lbl">Analyse & Notities</div><textarea rows="6" id="annArea" oninput="annotations=this.value;saveState()" placeholder="Schrijf je analyse hier...">'+annotations.replace(/</g,'&lt;')+'</textarea>';
      h+='<div class="lbl mt">Schaaksymbolen</div><div class="sym-row mb">';
      '± ∓ = ⩲ ⩱ +- -+ !! !? ?! ?? □ ⌓ → ↑ ⇆ △ ∞'.split(' ').forEach(s=>{h+='<button class="sym" onclick="addSym(\''+s+'\')">'+s+'</button>';});
      h+='</div>';
      h+='<button class="abtn abtn-blue w100" onclick="doCopy(buildPgn())">📋 Kopieer alles</button>';
    }
    if(activeTab==='share'){
      h+='<div style="background:#eef6ff;border:2px solid #a0bfff;border-radius:10px;padding:14px;margin-bottom:14px;font-size:min(3.2vw,13px);color:#1a4ec5;line-height:1.5">';
      h+='<b>Deel je partij!</b><br>Kopieer de deelcode en stuur deze via WhatsApp, iMessage, e-mail of Notities naar een ander apparaat. Plak de code daar in het invoerveld om de volledige partij te laden.</div>';
      h+='<div class="lbl">Deelcode exporteren</div>';
      h+='<textarea rows="4" id="exportArea" readonly style="font-size:min(2.8vw,11px);word-break:break-all">'+exportGame()+'</textarea>';
      h+='<div class="flex-row mt mb">';
      h+='<button class="abtn abtn-blue flex-1" onclick="doCopy(exportGame())">📋 Kopieer deelcode</button>';
      // Native share if available
      h+='<button class="abtn flex-1" style="background:#e8f5e9;color:#1b5e20;border:2px solid #a5d6a7" onclick="shareGame()">📤 Deel</button>';
      h+='</div>';
      h+='<div class="lbl mt">Deelcode importeren</div>';
      h+='<textarea rows="3" id="importArea" placeholder="Plak hier een deelcode..." style="font-size:min(2.8vw,11px);user-select:text;-webkit-user-select:text"></textarea>';
      h+='<button class="abtn abtn-blue w100 mt" onclick="var v=document.getElementById(\'importArea\').value;if(v.trim()){importGame(v);}">📥 Laad partij</button>';
    }
    h+='</div></div>';
  }
  document.getElementById('app').innerHTML=h;
  const mb=document.querySelector('.moves-box');if(mb)mb.scrollTop=mb.scrollHeight;
}
render();
if(engineOn){engineOn=false;toggleEngine();}
</script>
